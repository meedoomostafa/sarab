name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  devdiag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: DevDiag scan
        uses: meedoomostafa/devdiag@latest
        with:
          ci: 'true'
          save-report: 'true'
          fail-severity: high
